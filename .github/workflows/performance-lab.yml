name: Automotive Edge Performance & Stability Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Check Docker Compose
        run: docker compose version

      - name: Run performance suite
        run: ./scripts/run_suite.sh

      - name: Upload reports and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-lab-${{ github.run_id }}
          path: results/run-${{ env.RUN_ID }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop lab containers
        if: always()
        run: docker compose down --remove-orphans
